name: "CI"

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    name: "Validate Renovate config"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Every repo in the org extends these presets, so an invalid file here
      # breaks Renovate everywhere at once. Validate the files explicitly
      # rather than relying on the validator's directory discovery.
      - run: npm test
